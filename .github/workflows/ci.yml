name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Build & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history for secret scanning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and run Gitleaks secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --config-path=.gitleaks.toml --verbose --redact
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run dependency security audit
        run: npm audit --audit-level=high

      - name: Typecheck and Build
        run: npm run build

      - name: Run Vitest unit & integration tests
        run: npm test -- --reporter=verbose

      - name: Run database & RLS security tests
        run: npm run test:db
